name: Build

on:
  workflow_dispatch:
  push:
    branches:
      
"**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      
uses: actions/checkout@v4
uses: geode-sdk/build-geode-mod@main
    id: build
    with:
      sdk: nightly
uses: actions/upload-artifact@v4
  with:
    name: Build Output
    path: ${{ steps.build.outputs.build-output }}
